<svg xmlns="http://www.w3.org/2000/svg" width="440" height="206" viewBox="0 0 440 206" role="img" aria-label="RTR Engineering: Company website for an engineering firm, with a CMS the team edits themselves.">
  <style>
    .pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
    .cell { animation: pop .5s ease-out both; }
    @keyframes pop { from { opacity: 0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .cell, .cursor { animation: none; } }
  </style>
  <defs>
    <radialGradient id="glow" cx="1.0" cy="0.0" r="0.75">
      <stop offset="0" stop-color="#ff7a45" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#ffb86b"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="439" height="205" rx="16" fill="#11161d"/>
  <rect x="0.5" y="0.5" width="439" height="205" rx="16" fill="url(#glow)" stroke="#2a313c"/>
  <circle class="pulse" cx="32" cy="38" r="4" fill="#ff7a45"/><circle cx="32" cy="38" r="4" fill="#ff7a45"/><text x="44" y="42" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.2" fill="#ff7a45">CLIENT · LIVE</text>
  <path d="M400 42L410 32M402 32H410V40" fill="none" stroke="#9198a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#e6edf3">RTR Engineering</text>
  <text x="28" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9198a1">Company website for an engineering firm,</text><text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9198a1">with a CMS the team edits themselves.</text>
  <rect x="28" y="160" width="56" height="26" rx="13" fill="#1a2029" stroke="#2a313c"/><text x="56" y="177.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#9198a1">React</text><rect x="92" y="160" width="64" height="26" rx="13" fill="#1a2029" stroke="#2a313c"/><text x="124" y="177.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#9198a1">Strapi</text><rect x="164" y="160" width="64" height="26" rx="13" fill="#1a2029" stroke="#2a313c"/><text x="195" y="177.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#9198a1">Docker</text><rect x="235" y="160" width="56" height="26" rx="13" fill="#1a2029" stroke="#2a313c"/><text x="263" y="177.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#9198a1">Caddy</text>
